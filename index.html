<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сайт с анимацией в шапке</title>
    <!-- Подключение внешнего файла стилей -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <!-- Навигация -->
        <nav class="navbar">
            <a href="#" class="logo">
                <!-- Путь к вашему логотипу с прозрачным фоном -->
                <img src="images/logo_bl.png" alt="Логотип">
            </a>
            <ul class="nav-links">
                <li><a href="#">Главная</a></li>
                <li><a href="#">Услуги</a></li>
                <li><a href="#">Контакты</a></li>
            </ul>
        </nav>

        <!-- Анимация моря и корабля -->
        <div class="animation-container">
    <div class="wave wave-back"></div>
    <div class="wave wave-middle"></div>
    
    <!-- НОВАЯ ОБЕРТКА ДЛЯ ДВИЖЕНИЯ ВПЕРЕД -->
    <div class="ship-moving">
        <!-- САМ КОРАБЛЬ (ОТВЕЧАЕТ ЗА КАЧКУ И РАЗВОРOT) -->
        <img src="images/vessel.svg.svg" alt="Контейнеровоз" class="ship">
    </div>
    
    <div class="wave wave-front"></div>
</div>
    </header>

    <main class="content">
        <h1>Добро пожаловать на наш сайт</h1>
        <p>Здесь располагается основной контент страницы.</p>
    </main>

</body>
</html>
